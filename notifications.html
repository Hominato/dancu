    <style>
        .notif-item {
            display: flex; gap: 1rem; align-items: flex-start;
            padding: 1rem 1.25rem; border-bottom: 1px solid var(--color-border);
            transition: background var(--transition-speed); cursor: pointer;
        }
        .notif-item:hover { background: var(--color-bg); }
        .notif-item.unread { border-left: 4px solid var(--color-secondary); padding-left: calc(1.25rem - 4px); }
        .notif-icon {
            width: 42px; height: 42px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; flex-shrink: 0;
        }
        .notif-icon.info { background: rgba(59,130,246,0.12); color: #3b82f6; }
        .notif-icon.success { background: rgba(16,185,129,0.12); color: #10b981; }
        .notif-icon.warning { background: rgba(245,158,11,0.12); color: #f59e0b; }
        .notif-icon.danger { background: rgba(239,68,68,0.12); color: #ef4444; }
        .notif-actions-top { display:flex; gap:0.5rem; justify-content:flex-end; padding:0.75rem 1.25rem; border-bottom:1px solid var(--color-border); }
        .filter-tabs { display:flex; gap:0.5rem; padding:1rem 1.25rem; border-bottom:1px solid var(--color-border); flex-wrap:wrap; }
        .filter-tab { padding:0.4rem 1rem; border-radius:999px; font-size:0.8rem; font-weight:600; cursor:pointer; border:1.5px solid var(--color-border); background:transparent; color:var(--color-text-muted); transition:all var(--transition-speed); }
        .filter-tab.active { background:var(--color-primary); color:white; border-color:var(--color-primary); }
    </style>

</head>
