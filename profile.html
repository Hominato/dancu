        <!-- Main Content -->
        <div class="main-wrapper">
            <header class="top-header">
                <div class="header-left">
                    <button class="menu-toggle-btn"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="24" height="24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
                    <h1 class="page-title">Member Profile</h1>
                </div>
            </header>

            <main class="content-body" style="max-width:850px; margin:0 auto;">
                
                <!-- Member Summary Card -->
                <div class="card" style="margin-bottom:1.5rem; background:linear-gradient(135deg, var(--color-primary), var(--color-secondary)); color:white;">
                    <div style="display:flex; align-items:center; gap:1.25rem; flex-wrap:wrap;">
                        <div style="width:68px; height:68px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:800; border:2px solid rgba(255,255,255,0.4);" class="user-avatar-initials">
                            KG
                        </div>
                        <div>
                            <h2 style="font-size:1.4rem; font-weight:800;" class="user-display-name">Karlee Grey</h2>
                            <div style="font-size:0.875rem; opacity:0.9; margin-top:0.25rem;">Member ID: <strong id="profile-member-no">ACU-204718</strong> &bull; Member since <span id="profile-joined-date">March 2018</span></div>
                        </div>
                    </div>
                </div>

                <!-- Personal Information Form -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Personal & Contact Details</h2>
                    </div>

                    <form id="profile-form">
                        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:1.25rem;">
                            <div class="form-group">
                                <label class="form-label">First Name</label>
                                <input type="text" id="prof-fname" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Last Name</label>
                                <input type="text" id="prof-lname" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Email Address</label>
                                <input type="email" id="prof-email" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" id="prof-phone" class="form-control" required>
                            </div>
                            <div class="form-group" style="grid-column:1 / -1;">
                                <label class="form-label">Street Address</label>
                                <input type="text" id="prof-address" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">City</label>
                                <input type="text" id="prof-city" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">State</label>
                                <input type="text" id="prof-state" class="form-control" maxlength="2" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">ZIP Code</label>
                                <input type="text" id="prof-zip" class="form-control" maxlength="10" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Date of Birth</label>
                                <input type="date" id="prof-dob" class="form-control" readonly style="background:var(--color-bg); opacity:0.8;">
                            </div>
                        </div>

                        <div style="margin-top:1.5rem; display:flex; justify-content:flex-end;">
                            <button type="submit" class="btn btn-primary">Save Profile Changes</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
