<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Messages — AmeriCU Credit Union</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .messages-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.5rem;
        }
        .message-folder-list { display: flex; flex-direction: column; gap: 0.25rem; }
        .folder-item {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.65rem 1rem; border-radius: var(--radius-md);
            color: var(--color-text-muted); font-weight: 500; cursor: pointer;
            transition: all var(--transition-speed);
        }
        .folder-item:hover, .folder-item.active {
            background: var(--color-bg); color: var(--color-primary); font-weight: 600;
        }
        .message-item {
            display: flex; gap: 1rem; padding: 1rem; border-bottom: 1px solid var(--color-border);
            cursor: pointer; transition: background var(--transition-speed);
        }
        .message-item:hover { background: var(--color-bg); }
        .message-item.unread { border-left: 3px solid var(--color-secondary); padding-left: calc(1rem - 3px); }
        .message-avatar-icon {
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            color: white; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.9rem; flex-shrink: 0;
        }
        @media (max-width: 768px) {
            .messages-layout { grid-template-columns: 1fr; }
        }
    </style>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="shortcut icon" href="favicon.ico">
</head>

        <div class="main-wrapper">
            <header class="top-header">
                <div class="header-left">
                    <button class="menu-toggle-btn"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="24" height="24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
                    <h1 class="page-title">Secure Messaging Center</h1>
                </div>
            </header>

            <main class="content-body">
                <div class="messages-layout">
                    <!-- Left: Folders & Compose -->
                    <div>
                        <button id="compose-btn" class="btn btn-primary btn-full" style="margin-bottom:1.25rem;">+ Compose Message</button>
                        <div class="card" style="padding:1rem;">
                            <div class="message-folder-list">
                                <div class="folder-item active" data-folder="inbox">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
                                    Inbox
                                </div>
                                <div class="folder-item" data-folder="sent">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                                    Sent
                                </div>
                                <div class="folder-item" data-folder="archived">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
                                    Archived
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Message List / Detail -->
                    <div class="card" style="padding:0;">
                        <div id="message-list-panel">
                            <!-- Populated by JS -->
                        </div>
                        <div id="message-detail-panel" style="display:none; padding:1.5rem;">
                            <!-- Message detail injected by JS -->
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Compose Modal -->
    <div id="compose-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">New Secure Message to AmeriCU Support</h3>
                <button class="modal-close" onclick="App.closeModal('compose-modal')">&times;</button>
            </div>
            <form id="compose-form">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Subject</label>
                        <input type="text" id="compose-subject" class="form-control" placeholder="e.g. Account Inquiry" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Message</label>
                        <textarea id="compose-body" class="form-control" rows="5" placeholder="Type your message here..." required style="resize:vertical;"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="App.closeModal('compose-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </div>
            </form>
        </div>
    </div>
